[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualrl"
version = "0.1.0"
description = "Learn reinforcement learning by seeing every decision, target, and update."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Deep RL on MuJoCo robots (scripts/train_mujoco_ppo.py). For CPU-only torch: --index-url https://download.pytorch.org/whl/cpu
deep = ["torch>=2.1", "gymnasium[mujoco]>=1.0", "gymnasium-robotics>=1.3"]

[tool.setuptools.packages.find]
include = ["visualrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"visualrl.envs" = ["*.json"]
